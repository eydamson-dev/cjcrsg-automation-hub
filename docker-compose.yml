services:
  postgres:
    image: postgres:16-alpine
    container_name: social-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_manager}
      POSTGRES_USER: ${POSTGRES_USER:-social_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_manager} -d ${POSTGRES_DB:-social_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO(M1): api (AdonisJS + Prisma) — add Dockerfile + service entry
  # TODO(M1): web (Next.js) — add Dockerfile + service entry
  # TODO(M1): cloudflared — Cloudflare Tunnel exposing web + n8n

  n8n:
    image: n8nio/n8n:latest
    container_name: social-manager-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      GENERIC_TIMEZONE: ${TZ:-Asia/Manila}
      # n8n keeps its own DB; it must NOT share application tables.
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

volumes:
  postgres_data:
  n8n_data:
