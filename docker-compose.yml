services:
  postgres:
    image: postgres:16-alpine
    container_name: social-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_manager}
      POSTGRES_USER: ${POSTGRES_USER:-social_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_manager} -d ${POSTGRES_DB:-social_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: social-manager-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: http://localhost:3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-social_manager}:${POSTGRES_PASSWORD:-social_manager}@postgres:5432/${POSTGRES_DB:-social_manager}?schema=public
    ports:
      - "3333:3333"

  # TODO(M1): web, Next.js. Add a Dockerfile and service entry.
  # TODO(M1): cloudflared. Cloudflare Tunnel to expose web and n8n.

  n8n:
    image: n8nio/n8n:latest
    container_name: social-manager-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      GENERIC_TIMEZONE: ${TZ:-Asia/Manila}
      # n8n keeps its own DB; it must NOT share application tables.
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

volumes:
  postgres_data:
  n8n_data:
